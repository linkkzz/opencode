name: Build Windows Desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g., 1.0.0)"
        required: false
        type: string
  push:
    branches:
      - dev
      - opencode_staging

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          cd packages/desktop
          bun install

      - name: Get version
        id: version
        shell: powershell
        run: |
          if ("${{ inputs.version }}" -ne "") {
            $version = "${{ inputs.version }}"
          } else {
            $json = Get-Content packages/desktop/package.json -Raw | ConvertFrom-Json
            $version = $json.version
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"

      - name: Download CLI Sidecar
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Use GitHub CLI to get latest release (authenticated, no rate limit issues)
          $releaseInfo = gh release view --repo anomalyco/opencode --json assets

          Write-Host "Searching for windows-x64.zip in assets..."
          $asset = $releaseInfo.assets | Where-Object { $_.name -like "*windows-x64.zip" }

          if ($asset) {
            $downloadUrl = $asset.browser_download_url
          } else {
            Write-Error "Failed to find windows-x64.zip download URL"
            Write-Host "Available assets:"
            $releaseInfo.assets | ForEach-Object { Write-Host "  - $($_.name)" }
            exit 1
          }

          Write-Host "Downloading from: $downloadUrl"

          New-Item -ItemType Directory -Force -Path packages/desktop/src-tauri/target/sidecar-temp
          Invoke-WebRequest -Uri $downloadUrl -OutFile packages/desktop/src-tauri/target/sidecar-temp/opencode-windows-x64.zip

          New-Item -ItemType Directory -Force -Path packages/desktop/src-tauri/target/sidecar-unzipped
          Expand-Archive -Path packages/desktop/src-tauri/target/sidecar-temp/opencode-windows-x64.zip -DestinationPath packages/desktop/src-tauri/target/sidecar-unzipped

          # 创建 sidecars 目标目录
          New-Item -ItemType Directory -Force -Path packages/desktop/src-tauri/sidecars

          Write-Host "Checking extracted structure..."

          # 先尝试找到 bin 目录
          $binPath = Get-ChildItem packages/desktop/src-tauri/target/sidecar-unzipped -Recurse -Directory | Where-Object { $_.Name -eq "bin" } | Select-Object -First 1

          if ($binPath) {
            Write-Host "Found bin directory: $($binPath.FullName)"
            Copy-Item "$($binPath.FullName)/opencode.exe" packages/desktop/src-tauri/sidecars/opencode-cli-x86_64-pc-windows-msvc.exe
          } else {
            # 如果没有 bin 目录，直接找 opencode.exe
            Write-Host "No bin directory found, searching for opencode.exe directly..."
            $exePath = Get-ChildItem packages/desktop/src-tauri/target/sidecar-unzipped -Recurse -Filter "opencode.exe" | Select-Object -First 1
            if ($exePath) {
              Write-Host "Found opencode.exe: $($exePath.FullName)"
              Copy-Item $exePath.FullName packages/desktop/src-tauri/sidecars/opencode-cli-x86_64-pc-windows-msvc.exe
            } else {
              Write-Error "opencode.exe not found in extracted files!"
              Write-Host "Extracted structure:"
              Get-ChildItem packages/desktop/src-tauri/target/sidecar-unzipped -Recurse | ForEach-Object { Write-Host "  $($_.FullName)" }
              exit 1
            }
          }

          Write-Host "Sidecar prepared successfully"

      - name: Build Tauri App
        shell: powershell
        run: |
          cd packages/desktop
          bun x @tauri-apps/cli build --bundles nsis --target x86_64-pc-windows-msvc --config ./src-tauri/tauri.windows.conf.json

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-desktop-windows-x64-${{ steps.version.outputs.version }}
          path: packages/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          retention-days: 90

      - name: Generate Summary
        run: |
          echo "## Build Completed Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Target:** Windows x86_64" >> $GITHUB_STEP_SUMMARY
          echo "- **Bundle:** NSIS Installer" >> $GITHUB_STEP_SUMMARY
          echo "- **Sidecar:** Downloaded from official releases" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Download" >> $GITHUB_STEP_SUMMARY
          echo "The installer has been uploaded as an artifact. You can download it from the Actions page." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Note" >> $GITHUB_STEP_SUMMARY
          echo "This build is unsigned. Users will see a Windows SmartScreen warning. Refer to the installation guide for instructions on how to proceed." >> $GITHUB_STEP_SUMMARY
