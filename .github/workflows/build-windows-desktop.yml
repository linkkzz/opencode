name: Build Windows Desktop

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (e.g., 1.0.0) - if not specified, reads from package.json"
        required: false
        type: string
  push:
    branches:
      - dev
      - build-windows-*
      - opencode_staging

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: |
          cd packages/desktop
          bun install

      - name: Get version
        id: version
        shell: powershell
        run: |
          if ("${{ inputs.version }}" -ne "") {
            Write-Output "version=${{ inputs.version }}"
          } else {
            $json = Get-Content packages/desktop/package.json -Raw | ConvertFrom-Json
            Write-Output "version=$($json.version)"
          }
          $version = "${{ inputs.version }}"
          if ($version -eq "") {
            $json = Get-Content packages/desktop/package.json -Raw | ConvertFrom-Json
            $version = $json.version
          }
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"

      - name: Download CLI Sidecar
        shell: powershell
        run: |
          cd packages/desktop
          gh release download --pattern "opencode-windows-x64\.zip" --dir src-tauri/target/sidecar-temp --repo anomalyco/opencode
          New-Item -ItemType Directory -Force -Path src-tauri/sidecars
          Expand-Archive -Path src-tauri/target/sidecar-temp/opencode-windows-x64.zip -DestinationPath src-tauri/target/sidecar-unzipped
          Copy-Item src-tauri/target/sidecar-unzipped/*/bin/opencode.exe src-tauri/sidecars/opencode-cli.exe
          Write-Output "Sidecar prepared successfully"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build Tauri App
        shell: powershell
        run: |
          cd packages/desktop
          bun x @tauri-apps/cli build --bundles nsis --target x86_64-pc-windows-msvc --config ./src-tauri/tauri.windows.conf.json

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-desktop-windows-x64-${{ steps.version.outputs.version }}
          path: packages/desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          retention-days: 90

      - name: Generate Summary
        run: |
          echo "## ✨ Build Completed Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Build Information" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Target:** Windows x86_64" >> $GITHUB_STEP_SUMMARY
          echo "- **Bundle:** NSIS Installer" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📥 Download" >> $GITHUB_STEP_SUMMARY
          echo "The installer has been uploaded as an artifact. You can download it from the Actions page." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ⚠️ Note" >> $GITHUB_STEP_SUMMARY
          echo "This build is unsigned. Users will see a Windows SmartScreen warning. Refer to the installation guide for instructions on how to proceed." >> $GITHUB_STEP_SUMMARY
